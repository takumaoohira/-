name: Build Pocket Pet iOS

on:
  push:
    paths:
      - "desktop-pet/ios/**"
      - "desktop-pet/web/**"
      - ".github/workflows/pocket-pet-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop-pet/ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator (no signing)
        run: |
          xcodebuild -project PocketPet.xcodeproj -scheme PocketPet \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -80
          exit ${PIPESTATUS[0]}
