<title>モン・サン・ミシェル散策</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D world; HUD floats as slate-and-gilt plaques pinned to the corners */
:root{
  color-scheme: dark;
  --ink:#0d1216;
  --plate:rgba(14,20,25,.74);
  --plate-solid:#141c22;
  --line:rgba(214,186,118,.34);
  --gold:#d8b665;
  --fg:#efe8da;
  --muted:#a8a395;
  --sea:#86aba4;
  --warn:#f0a35a;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --latin:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --gut:16px;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.plate{background:var(--plate);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.28)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--latin);font-style:italic;font-size:13px;letter-spacing:.06em;color:var(--gold)}

#tl{position:fixed;left:calc(var(--gut) + env(safe-area-inset-left,0px));top:calc(var(--gut) + env(safe-area-inset-top,0px));padding:12px 14px 12px;width:min(272px,calc(100vw - 2*var(--gut) - 136px));display:grid;gap:6px}
#place{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.25;text-wrap:balance}
#alt{font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.row label,.row .lab{letter-spacing:.08em}
#time{width:100%;accent-color:var(--gold);min-width:0}
#timeOut{color:var(--fg);font-variant-numeric:tabular-nums;font-size:13px;min-width:3.2em;text-align:right}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;grid-column:2 / 4}
.seg button{flex:1;background:transparent;color:var(--muted);border:0;padding:5px 0;font:500 12px var(--body);cursor:pointer;letter-spacing:.1em}
.seg button[aria-pressed="true"]{background:rgba(216,182,101,.18);color:var(--fg)}
.seg button+button{border-left:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#mapBox{position:fixed;right:calc(var(--gut) + env(safe-area-inset-right,0px));top:calc(var(--gut) + env(safe-area-inset-top,0px));padding:6px;line-height:0}
#map{width:176px;height:176px;border-radius:3px;display:block}
#mapNote{position:absolute;left:10px;bottom:9px;line-height:1.2;font-size:11px;color:var(--fg);text-shadow:0 1px 2px #000}

#spotsBtn{position:fixed;left:calc(var(--gut) + env(safe-area-inset-left,0px));bottom:calc(var(--gut) + env(safe-area-inset-bottom,0px));color:var(--fg);font:500 13px var(--body);letter-spacing:.08em;padding:10px 14px;cursor:pointer}
#spots{position:fixed;left:calc(var(--gut) + env(safe-area-inset-left,0px));bottom:calc(var(--gut) + 50px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100vw - 2*var(--gut)));max-height:min(60vh,460px);overflow:auto;padding:6px}
#spots button{display:grid;grid-template-columns:1fr;text-align:left;width:100%;background:transparent;border:0;border-radius:4px;color:var(--fg);padding:8px 10px;cursor:pointer;font:500 14px var(--body)}
#spots button:hover{background:rgba(216,182,101,.14)}
#spots button span{font:italic 500 13px var(--latin);color:var(--gold)}

#poi{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--gut) + env(safe-area-inset-bottom,0px));width:min(520px,calc(100vw - 2*var(--gut)));padding:14px 18px 16px;transition:opacity .4s}
#poi .fr{font:italic 600 15px var(--latin);color:var(--gold);letter-spacing:.03em}
#poi h2{margin:2px 0 6px;font:700 20px/1.3 var(--display);text-wrap:balance}
#poi p{margin:0;font-size:13.5px;line-height:1.75;color:#ddd6c7}

#toast{position:fixed;left:50%;top:calc(var(--gut) + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(60,30,10,.85);border:1px solid var(--warn);color:#ffe2c4;padding:8px 14px;border-radius:4px;font-size:13px;max-width:calc(100vw - 2*var(--gut) - 200px)}
#keys{position:fixed;right:calc(var(--gut) + env(safe-area-inset-right,0px));bottom:calc(var(--gut) + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--muted);text-align:right;line-height:1.7;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#keys b{color:var(--fg);font-weight:500;border:1px solid rgba(239,232,218,.35);border-radius:3px;padding:0 4px;margin:0 1px}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}

#joy{position:fixed;left:calc(28px + env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;border:1px solid var(--line);background:rgba(14,20,25,.35)}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(216,182,101,.35);border:1px solid var(--gold)}
#runBtn{position:fixed;right:calc(var(--gut) + env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;color:var(--fg);font:500 12px var(--body);cursor:pointer}
#runBtn[aria-pressed="true"]{background:rgba(216,182,101,.3)}

#start{position:fixed;inset:0;display:grid;place-items:center;padding:24px var(--gut);background:linear-gradient(180deg,rgba(8,12,16,.15) 0%,rgba(8,12,16,.55) 55%,rgba(8,12,16,.86) 100%)}
#startCard{width:min(560px,100%);display:grid;gap:14px;text-align:left;align-self:end;margin-bottom:6vh}
#startCard .fr{font:italic 600 clamp(40px,8vw,72px)/1 var(--latin);color:#f6eedd;letter-spacing:.01em;text-shadow:0 2px 30px rgba(0,0,0,.4)}
#startCard h1{margin:0;font:700 clamp(20px,3.6vw,28px)/1.35 var(--display);color:var(--gold);letter-spacing:.12em}
#startCard p{margin:0;font-size:14px;line-height:1.85;color:#ddd5c4;max-width:34em}
#go{justify-self:start;background:var(--gold);color:#1a1408;border:0;border-radius:4px;padding:12px 26px;font:700 15px var(--body);letter-spacing:.14em;cursor:pointer}
#go:disabled{opacity:.55;cursor:progress}
#startKeys{font-size:12.5px;color:var(--muted);line-height:1.9}
#startKeys b{color:var(--fg);font-weight:500}

@media (max-width:620px){
  #map{width:112px;height:112px}
  #tl{width:calc(100vw - 2*var(--gut) - 140px);padding:10px 11px}
  #place{font-size:16px}
  #poi p{font-size:12.5px;line-height:1.65}
  #poi h2{font-size:17px}
  #keys{display:none}
  #toast{max-width:calc(100vw - 2*var(--gut))}
}
body.touch #poi{bottom:calc(222px + env(safe-area-inset-bottom,0px))}
body.touch #poi p{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:reduce){#poi{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="モン・サン・ミシェルの3Dビュー"></canvas>
<div id="cross" hidden></div>

<div id="tl" class="plate">
  <div class="eyebrow">Mont-Saint-Michel · Normandie</div>
  <div id="place">歩道橋（パスレル）</div>
  <div id="alt" class="num">標高 4 m ・ 潮位 −1.6 m</div>
  <div class="row"><label for="time">時刻</label><input id="time" type="range" min="0" max="24" step="0.05" value="16.5"><output id="timeOut" for="time">16:30</output></div>
  <div class="row"><span class="lab">潮</span><div class="seg" role="group" aria-label="潮の状態"><button id="tideLow" aria-pressed="true">干潮</button><button id="tideHigh" aria-pressed="false">満潮</button></div></div>
</div>

<div id="mapBox" class="plate"><canvas id="map" width="352" height="352" aria-label="現在地の地図"></canvas><div id="mapNote" class="num"></div></div>

<button id="spotsBtn" class="plate" aria-expanded="false" aria-controls="spots">スポットへ移動</button>
<div id="spots" class="plate" hidden></div>

<div id="poi" class="plate" hidden><div class="fr"></div><h2></h2><p></p></div>
<div id="toast" role="status" hidden></div>
<div id="keys"><b>W A S D</b> 移動　<b>Shift</b> 走る　<b>Space</b> ジャンプ<br>マウス 視点　<b>M</b> 地図　<b>Esc</b> カーソル解放</div>

<div id="joy" hidden><div id="knob"></div></div>
<button id="runBtn" class="plate" aria-pressed="false" hidden>走る</button>

<div id="start">
  <div id="startCard">
    <div class="fr">Mont-Saint-Michel</div>
    <h1>モン・サン・ミシェル散策</h1>
    <p>ノルマンディーの湾に浮かぶ花崗岩の小島。歩道橋を渡り、王の門をくぐって、グランド・リュから標高80mの修道院まで歩いてみましょう。時刻と潮の満ち引きも変えられます。</p>
    <button id="go" disabled>準備中…</button>
    <div id="startKeys"><b>パソコン</b>　WASD で移動、Shift で走る、マウスで見回す<br><b>スマホ</b>　左下のスティックで移動、画面をドラッグして見回す</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
// ============================================================ utilities
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const DEG=Math.PI/180;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=rng(20140722);
function hash(x,y){const h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o){let s=0,a=0.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=0.5;}return s;}
const C=h=>new THREE.Color(h).convertSRGBToLinear();

// ============================================================ renderer / scene
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xbcd3e6,650,5200);
const camera=new THREE.PerspectiveCamera(68,1,0.2,9000);
camera.rotation.order='YXZ';
const maxAniso=renderer.capabilities.getMaxAnisotropy();

// ============================================================ procedural textures
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
function speckle(g,w,h,amt){const id=g.getImageData(0,0,w,h),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-0.5)*amt;d[i]+=n;d[i+1]+=n;d[i+2]+=n*0.92;}g.putImageData(id,0,0);}
function tex(c,mx,my,srgb=true){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;t.repeat.set(1/mx,1/my);return t;}
function ashlar(g,W,H,ppm,rowM,tone){
  g.fillStyle='#5f5951';g.fillRect(0,0,W,H);
  const rowH=rowM*ppm;let y=0,row=0;
  while(y<H-1){let x=-(row%2)*0.45*ppm;
    while(x<W){const bw=(0.55+Math.random()*0.75)*ppm,v=Math.random(),warm=Math.random()<0.28;
      const b=tone+v*30;g.fillStyle=`rgb(${(b+(warm?16:0))|0},${(b-2+(warm?9:0))|0},${(b-11-(warm?12:0))|0})`;
      g.fillRect(x+1.5,y+1.5,bw-3,rowH-3);if(x+bw>W)g.fillRect(x-W+1.5,y+1.5,bw-3,rowH-3);
      if(Math.random()<0.3){g.fillStyle='rgba(40,38,30,.18)';g.fillRect(x+2,y+rowH*0.55,bw-4,rowH*0.4);}
      x+=bw;}
    y+=rowH;row++;}
  speckle(g,W,H,34);
}
function lancet(g,cx,yb,w,h,fill,lead){ // cx,yb in px (yb = bottom), pointed arch
  const x0=cx-w/2,top=yb-h,r=w*0.85;
  g.beginPath();g.moveTo(x0,yb);g.lineTo(x0,top+w*0.55);
  g.arc(x0+r,top+w*0.55,r,Math.PI,Math.PI+Math.acos((r-w/2)/r)*1.0,false);
  g.arc(x0+w-r,top+w*0.55,r,-Math.acos((r-w/2)/r),0,false);
  g.lineTo(x0+w,yb);g.closePath();g.fillStyle=fill;g.fill();
  if(lead){g.strokeStyle=lead;g.lineWidth=2;g.beginPath();g.moveTo(cx,yb);g.lineTo(cx,top+w*0.3);
    for(let yy=yb-w*0.6;yy>top+w*0.6;yy-=w*0.55){g.moveTo(x0,yy);g.lineTo(x0+w,yy);}g.stroke();}
  g.strokeStyle='rgba(205,198,184,.7)';g.lineWidth=3;g.stroke();
}
// granite ashlar, 4m tile
const [cGr,gGr]=mk(512,512);ashlar(gGr,512,512,128,0.5,118);
const texGranite=tex(cGr,4,4);
// abbey wall with lancet window, 6m x 9m tile
const [cAb,gAb]=mk(288,432);ashlar(gAb,288,432,48,0.45,124);
lancet(gAb,144,432-2.0*48,1.5*48,5.4*48,'#22272b','rgba(120,120,110,.6)');
const texAbbey=tex(cAb,6,9);
const [cAbE,gAbE]=mk(288,432);gAbE.drawImage(cAb,0,0);gAbE.fillStyle='rgba(0,0,0,.55)';gAbE.fillRect(0,0,288,432);
lancet(gAbE,144,432-2.0*48,1.5*48,5.4*48,'#ffc875',null);
const texAbbeyE=tex(cAbE,6,9);
// merveille: tall buttressed facade, 5.5m x 11m tile
const [cMv,gMv]=mk(264,528);ashlar(gMv,264,528,48,0.42,116);
lancet(gMv,132,528-2.6*48,0.8*48,2.2*48,'#1f2427',null);
lancet(gMv,132,528-6.2*48,0.95*48,4.2*48,'#1f2427','rgba(110,110,100,.6)');
const texMerv=tex(cMv,5.5,11);
const [cMvE,gMvE]=mk(264,528);gMvE.drawImage(cMv,0,0);gMvE.fillStyle='rgba(0,0,0,.55)';gMvE.fillRect(0,0,264,528);
lancet(gMvE,132,528-6.2*48,0.95*48,4.2*48,'#ffbf6a',null);
const texMervE=tex(cMvE,5.5,11);
// house facades, 8m x 6m tile (2 bays x 2 floors)
function houseWindows(g,H,ppm,lit){
  for(let f=0;f<2;f++)for(let b=0;b<2;b++){
    const cx=(2+b*4)*ppm,yb=H-(f*3+0.95)*ppm,w=1.05*ppm,h=1.35*ppm;
    if(lit){if(Math.random()<0.62){g.fillStyle=Math.random()<0.5?'#ffb85e':'#ffd58e';g.fillRect(cx-w/2,yb-h,w,h);g.fillStyle='#000';g.fillRect(cx-1,yb-h,2,h);g.fillRect(cx-w/2,yb-h*0.62,w,2);}continue;}
    g.fillStyle='#9e978a';g.fillRect(cx-w/2-6,yb-h-9,w+12,9);g.fillRect(cx-w/2-4,yb,w+8,6);
    g.fillStyle='#262b2f';g.fillRect(cx-w/2,yb-h,w,h);
    g.fillStyle='rgba(150,170,190,.28)';g.fillRect(cx-w/2+3,yb-h+3,w*0.42,h*0.38);
    g.strokeStyle='#e9e4d8';g.lineWidth=3;g.strokeRect(cx-w/2,yb-h,w,h);
    g.lineWidth=2;g.beginPath();g.moveTo(cx,yb-h);g.lineTo(cx,yb);g.moveTo(cx-w/2,yb-h*0.62);g.lineTo(cx+w/2,yb-h*0.62);g.stroke();
  }
}
function rubble(g,W,H,ppm){
  g.fillStyle='#776f63';g.fillRect(0,0,W,H);
  for(let i=0;i<1100;i++){const x=Math.random()*W,y=Math.random()*H,rw=(0.12+Math.random()*0.32)*ppm,rh=rw*(0.45+Math.random()*0.4);
    const b=95+Math.random()*60,w=Math.random()<0.3;g.fillStyle=`rgb(${(b+(w?14:0))|0},${(b-3+(w?6:0))|0},${(b-12)|0})`;
    g.beginPath();g.ellipse(x,y,rw/2,rh/2,Math.random()*0.4-0.2,0,Math.PI*2);g.fill();}
  speckle(g,W,H,26);
}
const [cRb,gRb]=mk(512,384);rubble(gRb,512,384,64);houseWindows(gRb,384,64,false);
const [cRbE,gRbE]=mk(512,384);gRbE.fillStyle='#000';gRbE.fillRect(0,0,512,384);houseWindows(gRbE,384,64,true);
const texRubble=tex(cRb,8,6),texRubbleE=tex(cRbE,8,6);
const [cTm,gTm]=mk(512,384);
gTm.fillStyle='#e2d6c1';gTm.fillRect(0,0,512,384);speckle(gTm,512,384,16);
gTm.fillStyle='#4a3324';
for(const xm of [0,1.35,2.75,4,5.35,6.75])gTm.fillRect(xm*64-6,0,12,384);
for(const ym of [0,2.95,3,5.95])gTm.fillRect(0,384-ym*64-7,512,14);
gTm.lineWidth=10;gTm.strokeStyle='#4a3324';
for(let f=0;f<2;f++){const yb=384-f*192,yt=yb-185;gTm.beginPath();gTm.moveTo(0.15*64,yb);gTm.lineTo(1.3*64,yt);gTm.moveTo(5.4*64,yt);gTm.lineTo(6.7*64,yb);gTm.stroke();}
houseWindows(gTm,384,64,false);
const texTimber=tex(cTm,8,6);
const [cTm2,gTm2]=mk(512,384);gTm2.drawImage(cTm,0,0);gTm2.globalCompositeOperation='multiply';gTm2.fillStyle='#d8c6a8';gTm2.fillRect(0,0,512,384);
const texTimber2=tex(cTm2,8,6);
// slate roof, 4m tile
const [cSl,gSl]=mk(256,256);gSl.fillStyle='#2b3038';gSl.fillRect(0,0,256,256);
for(let y=0,r=0;y<256;y+=14,r++)for(let x=-(r%2)*11;x<256;x+=22){const b=56+Math.random()*26;gSl.fillStyle=`rgb(${b|0},${(b+5)|0},${(b+14)|0})`;gSl.fillRect(x+1,y+1,20,12);}
speckle(gSl,256,256,14);
const texSlate=tex(cSl,4,4);
// lead roof
const [cLd,gLd]=mk(256,256);gLd.fillStyle='#5d666c';gLd.fillRect(0,0,256,256);speckle(gLd,256,256,22);
gLd.fillStyle='rgba(200,210,215,.22)';for(let x=0;x<256;x+=38)gLd.fillRect(x,0,3,256);
const texLead=tex(cLd,4,4);
// wooden deck
const [cDk,gDk]=mk(256,256);gDk.fillStyle='#857c6e';gDk.fillRect(0,0,256,256);
for(let y=0;y<256;y+=10){const b=118+Math.random()*30;gDk.fillStyle=`rgb(${b|0},${(b-8)|0},${(b-20)|0})`;gDk.fillRect(0,y,256,8);}
speckle(gDk,256,256,18);
const texDeck=tex(cDk,4,4);

const [cDt,gDt]=mk(256,256);gDt.fillStyle='#e6e6e6';gDt.fillRect(0,0,256,256);

  if(z<-1200)h-=Math.min(1,(-z-1200)/1600)*5.5;
  const cx=-165+70*Math.sin(z/320)+(z>600?(z-600)*0.12:0),d=x-cx;h-=2.7*Math.exp(-(d*d)/(34*34));
  const cx2=950+220*Math.sin(z/520)-Math.max(0,-z)*0.25,d2=x-cx2;h-=2.2*Math.exp(-(d2*d2)/(60*60));

for(let p=0;p<3;p++){for(let i=3;i<CHAT;i++)PH[i]=(PH[i-1]+2*PH[i]+PH[i+1])/4;for(let i=3;i<=CHAT;i++)PH[i]=Math.max(PH[i],PH[i-1]+0.4);}
{let L=0;const cum=[0];for(let i=CHAT+1;i<PATH.length;i++){L+=Math.hypot(PATH[i][0]-PATH[i-1][0],PATH[i][1]-PATH[i-1][1]);cum.push(L);}

const STEP=0.62,EYE=1.65,PR=0.35;

function query(x,z,y){

    if(t<=y+STEP){if(t>g){g=t;kind=s.kind;}}else if(s.bot==null||s.bot<y+1.8)blocked=true;}

}
function tpGround(x,z){let g=terrainH(x,z),kind='ground';for(const s of solids){if(!s.walk)continue;const t=solidTop(s,x,z,0);if(t!=null&&t>g){g=t;kind=s.kind;}}return {g,kind};}

function tryMove(nx,nz){
  const q=query(nx,nz,P.y);
  if(q.blocked||q.g>P.y+STEP)return false;
  if(q.kind==='ground'&&q.g>P.y+0.02){const cur=terrainH(P.x,P.z),dist=Math.hypot(nx-P.x,nz-P.z)+1e-6;if((q.g-cur)/dist>1.35)return false;}

}

    let r,gg,b;if(h<0.4){const w=sstep(0.4,-1.5,h);r=lerp(196,120,w);gg=lerp(186,136,w);b=lerp(160,136,w);}else{const t=clamp(h/80,0,1);r=lerp(120,214,t);gg=lerp(126,206,t);b=lerp(98,186,t);}
    id.data[k]=r;id.data[k+1]=gg;id.data[k+2]=b;id.data[k+3]=255;}
  g.putImageData(id,0,0);
  const S=v=>(v+MW/2)*MS/MW;
  g.strokeStyle='rgba(40,34,26,.85)';g.lineWidth=3;g.beginPath();ringPts.forEach((p,i)=>{if(i===0||ringPts[i-1].gateL)g.moveTo(S(p.x),S(p.z));else g.lineTo(S(p.x),S(p.z));});g.stroke();
  g.strokeStyle='rgba(255,246,225,.9)';g.lineWidth=2;g.beginPath();PATH.forEach(([x,z],i)=>i?g.lineTo(S(x),S(z)):g.moveTo(S(x),S(z)));g.stroke();
  g.fillStyle='rgba(60,52,44,.9)';for(const [x0,z0,x1,z1] of [[-30,-7,34,7],[4,-17,16,17],[-2,-46,42,-22],[-30,-30,-2,-9],[16,12,36,22]])g.fillRect(S(x0),S(z0),S(x1)-S(x0),S(z1)-S(z0));
  g.fillStyle='#8e8571';g.fillRect(S(-4),S(BR0),S(4)-S(-4),MS);
}
function drawMap(){
  mg.drawImage(mapBase,0,0);
  const S=v=>(v+MW/2)*MS/MW;
  const lvl=tide;if(lvl>-1.5){mg.fillStyle=`rgba(70,105,110,${clamp((lvl+1.5)/4.6,0,1)*0.55})`;mg.fillRect(0,0,MS,MS);}
  let px=S(P.x),pz=S(P.z),out=false;if(px<8||px>MS-8||pz<8||pz>MS-8){out=true;px=clamp(px,10,MS-10);pz=clamp(pz,10,MS-10);}
  mg.save();mg.translate(px,pz);mg.rotate(-P.yaw);mg.fillStyle='#d8b665';mg.strokeStyle='#1a1408';mg.lineWidth=2.5;
  mg.beginPath();mg.moveTo(0,-13);mg.lineTo(8,9);mg.lineTo(0,4);mg.lineTo(-8,9);mg.closePath();mg.fill();mg.stroke();mg.restore();
  mapNote.textContent=out?`島まで ${(Math.hypot(P.x,P.z)/1000).toFixed(2)} km`:'';
}

// ============================================================ time of day
const cDayTop=C('#3f78c0'),cDayHor=C('#c4d6e4'),cSetTop=C('#33416e'),cSetHor=C('#f0a46a'),cNightTop=C('#040814'),cNightHor=C('#172036'),cSun=C('#fff3dd'),cSunSet=C('#ff9a4d');
const tmpA=new THREE.Color(),tmpB=new THREE.Color(),sunDir=new THREE.Vector3(),moonDir=new THREE.Vector3();
function applyTime(){
  const th=(timeH-6)/12*Math.PI;
  sunDir.set(Math.cos(th),Math.sin(th)*0.88,Math.sin(th)*0.42+0.18).normalize();
  moonDir.copy(sunDir).multiplyScalar(-1);moonDir.y=Math.abs(moonDir.y)*0.9+0.15;moonDir.normalize();
  const e=sunDir.y,day=sstep(-0.04,0.28,e),set=(1-sstep(0.02,0.32,e))*sstep(-0.16,0.0,e),night=1-sstep(-0.18,0.0,e);
  tmpA.copy(cNightTop).lerp(cDayTop,day).lerp(cSetTop,set*0.6);tmpB.copy(cNightHor).lerp(cDayHor,day).lerp(cSetHor,set*0.75);
  skyU.top.value.copy(tmpA);skyU.hor.value.copy(tmpB);skyU.sunDir.value.copy(sunDir);skyU.night.value=night;skyU.moonDir.value.copy(moonDir);
  skyU.sunCol.value.copy(cSun).lerp(cSunSet,set);
  scene.fog.color.copy(tmpB);
  const useSun=e>-0.02,L=useSun?sunDir:moonDir;
  sun.position.copy(sun.target.position).addScaledVector(L,600);
  sun.color.copy(useSun?skyU.sunCol.value:C('#9fb2d6'));sun.intensity=useSun?(0.4+2.6*day)*sstep(-0.02,0.06,e):0.32*night;
  hemi.intensity=0.18+0.55*day+0.12*set;hemi.color.copy(tmpA).lerp(new THREE.Color(1,1,1),0.45);hemi.groundColor.copy(C('#5d5546')).multiplyScalar(0.4+0.6*day);
  for(const k of FLOOD)MAT[k].emissiveIntensity=night*0.55;
  for(const k of WIN)MAT[k].emissiveIntensity=sstep(0.15,0.9,night)*1.4;
  MAT.gold.emissiveIntensity=0.35+night*1.2;
  renderer.toneMappingExposure=1.05+night*0.25;
  waterU.sunDir.value.copy(L);waterU.sunCol.value.copy(sun.color).multiplyScalar(useSun?1:0.4);waterU.sky.value.copy(tmpA);waterU.hor.value.copy(tmpB);
  waterU.deep.value.copy(C('#4c5b55')).multiplyScalar(0.25+0.75*day);
  waterU.fogCol.value.copy(tmpB);
}

// ============================================================ loop
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?78:68;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let last=performance.now(),tAcc=0,frame=0,lastTimeApplied=-1;
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;tAcc+=dt;frame++;
  // movement
  if(started){
    let f=0,s=0;
    if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyD||keys.ArrowRight)s+=1;if(keys.KeyA||keys.ArrowLeft)s-=1;
    if(joyId!=null){f-=joyV.y;s+=joyV.x;}
    const l=Math.hypot(f,s);if(l>1){f/=l;s/=l;}
    const run=keys.ShiftLeft||keys.ShiftRight||runToggle,sp=(run?10:4.2)*(P.kind==='ground'&&tide>P.ground?0.6:1);
    const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
    let dx=(fx*f+rx*s)*sp*dt,dz=(fz*f+rz*s)*sp*dt;
    const n=Math.ceil(Math.hypot(dx,dz)/0.3)||1;dx/=n;dz/=n;
    for(let i=0;i<n;i++){if(!tryMove(P.x+dx,P.z+dz)){if(!tryMove(P.x+dx,P.z))tryMove(P.x,P.z+dz);}}
    if(l>0.05)P.bob+=dt*sp*1.9;
    const q=query(P.x,P.z,P.y);P.ground=q.g;P.kind=q.kind;
  }
  const floor=Math.max(P.ground,tide-1.25);
  P.vy-=22*dt;P.y+=P.vy*dt;
  if(P.y<floor){if(floor-P.y<STEP+0.05&&P.vy<=0)P.y=lerp(P.y,floor,Math.min(1,dt*18));else P.y=floor;if(P.y>floor-0.02)P.y=floor;P.vy=Math.max(0,P.vy);}
  if(deepWarnT>0)deepWarnT-=dt;
  // tide
  tide+=(tideTarget-tide)*Math.min(1,dt*0.12);if(Math.abs(tideTarget-tide)<0.01)tide=tideTarget;
  water.position.y=tide;waterU.time.value=tAcc;
  // camera
  const bob=Math.sin(P.bob)*0.045;
  camera.position.set(P.x,P.y+EYE+bob,P.z);
  if(!started){P.yaw=Math.sin(tAcc*0.07)*0.12;P.pitch=0.13;}
  camera.rotation.set(P.pitch,P.yaw,0);
  sky.position.copy(camera.position);waterU.camPos.value.copy(camera.position);
  if(timeH!==lastTimeApplied){applyTime();lastTimeApplied=timeH;}
  // gulls
  for(const g of gulls){const u=g.userData,a=u.ph+tAcc*u.sp;g.position.set(Math.cos(a)*u.R,u.h+Math.sin(tAcc*0.3+u.ph)*4,Math.sin(a)*u.R);g.rotation.y=-a+(u.sp>0?0:Math.PI);
    const fl=Math.sin(tAcc*u.fl+u.ph)*0.5;u.l.rotation.z=fl;u.r.rotation.z=-fl;}
  updateUI(dt);if(frame%3===0)drawMap();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
applyTime();
const go=$('go');go.disabled=false;go.textContent='散策をはじめる';
if(isTouch){$('joy').hidden=false;runBtn.hidden=false;document.body.classList.add('touch');$('keys').hidden=true;}
go.addEventListener('click',()=>{started=true;$('start').hidden=true;P.pitch=0.05;canvas.focus();
  if(!isTouch){try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(_){}}});
// keep the walk across live updates of the page
function boot(data){
  if(data&&data.P){Object.assign(P,data.P);timeH=data.timeH??timeH;timeIn.value=timeH;timeOut.textContent=fmtT(timeH);setTide(!!data.high);tide=tideTarget;
    if(data.started){started=true;$('start').hidden=true;}}
  requestAnimationFrame(t=>{last=t;tick(t);});
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({P:{x:P.x,z:P.z,y:P.y,yaw:P.yaw,pitch:P.pitch,ground:P.ground,kind:P.kind},timeH,high:tideTarget>0,started}));
hot&&hot.ready?hot.ready(boot):boot((hot&&hot.data)||{});
window.__MSM={P,solids,houseCount,teleport,setTime:t=>{timeH=t;},setTide};
})();
</script>
