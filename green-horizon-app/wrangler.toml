# Cloudflare Pages の設定（npx wrangler pages deploy で使用）
name = "green-horizon"
pages_build_output_dir = "public"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "green-horizon"
database_id = "00000000-0000-0000-0000-000000000000" # ← npx wrangler d1 create green-horizon で表示されたIDに置き換える

# 秘密の値はここに書かない。次のコマンドで登録する：
#   npx wrangler pages secret put STRIPE_SECRET_KEY
#   npx wrangler pages secret put STRIPE_WEBHOOK_SECRET
