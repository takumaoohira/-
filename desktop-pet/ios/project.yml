name: PocketPet
options:
  bundleIdPrefix: jp.pocketpet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 自分の Apple ID のチームIDを入れる(Xcode の Signing & Capabilities でも設定可)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PocketPet:
    type: application
    platform: iOS
    sources:
      - path: PocketPet
      - path: Shared
      - path: ../web/index.html
        buildPhase: resources
    entitlements:
      path: PocketPet/PocketPet.entitlements
    info:
      path: PocketPet/Info.plist
      properties:
        CFBundleDisplayName: ポケットペット
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [pocketpet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.pocketpet.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PocketPetWidget
  PocketPetWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PocketPetWidget
      - path: Shared
    entitlements:
      path: PocketPetWidget/PocketPetWidget.entitlements
    info:
      path: PocketPetWidget/Info.plist
      properties:
        CFBundleDisplayName: ポケットペット
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.pocketpet.app.widget
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  PocketPet:
    build:
      targets:
        PocketPet: all
        PocketPetWidget: all
